# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: tailfed

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

checksum:
  name_template: checksums.txt

before:
  hooks:
    - go mod tidy

nightly:
  publish_release: false
  version_template: nightly
  tag_name: nightly

partial:
  by: target

builds:
  - id: client
    main: ./cmd/client
    binary: tailfed-client
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    goarm: ["6", "7"]
    env:
      - CGO_ENABLED=0
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    hooks: &build-hooks
      post:
        - cmd: cosign sign-blob --yes --bundle={{ .Path }}.sigstore.json {{ .Path }}
        - cmd: syft scan {{ .Path }} --output spdx-json={{ .Path }}.spdx.json

  - id: server
    main: ./cmd/server
    binary: tailfed-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    hooks: *build-hooks

archives:
  - id: client
    ids: [client]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      tailfed-client_
      {{- .Os }}_
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files: &archive-files
      - src: "{{ .ArtifactPath }}.sigstore.json"
        strip_parent: true
        info:
          mode: 0644
      - src: "{{ .ArtifactPath }}.spdx.json"
        strip_parent: true
        info:
          mode: 0644

  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: tailfed-server_{{ .Os }}_{{ .Arch }}
    files: *archive-files

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  mode: keep-existing
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

blobs:
  - provider: s3
    region: "{{ .Env.AWS_REGION }}"
    bucket: tailfed-artifacts
    directory: "{{ .Version }}"
    ids: [client, server]
